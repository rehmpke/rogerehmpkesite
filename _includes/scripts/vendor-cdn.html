<!--Loading JavaScripts
==================================================-->
<script src="./assets/js/index.js" defer></script>

<!-- GPT Assistant Chat Widget -->
<div id="ai-widget-button">💬 Ask about Roger's work</div>

<div id="ai-widget-box" style="display:none">
    <div id="ai-widget-log" aria-live="polite"></div>
    <textarea id="ai-widget-input" placeholder="Ask a question about my work or this site..."></textarea>
    <button type="button" onclick="submitPrompt()">Ask</button>
</div>

<style>
    #ai-widget-button {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        background: #0f1d2e;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 0.8rem;
        cursor: pointer;
        z-index: 999;
    }

    #ai-widget-box {
        position: fixed;
        bottom: 4rem;
        right: 1rem;
        background: white;
        width: 300px;
        border: 1px solid #ccc;
        padding: 1rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        z-index: 998;
    }

    #ai-widget-log {
        max-height: 200px;
        overflow-y: auto;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
    }

    #ai-widget-input {
        width: 100%;
        height: 60px;
        color: #000;
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.5/purify.min.js" defer
    integrity="sha512-/CUtA84sWWqWEBejNrrtWa7Yc4cth3Ome2ymvCKOo9YcZ4sh98tndUy4LutE2xGcAgD4fyz16y+gSyJdGCB5ww=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
    const endpoint = "https://tei23dyloh.execute-api.us-east-1.amazonaws.com/prod/gptAssistantHandler";

    const introText = `
Hi there — I'm here to help you learn more about Roger Ehmpke's work.

Roger leads higher-ed web strategy and digital experience, with a focus on accessibility governance, CMS architecture, UX, analytics, AI-ready content, and public-facing digital systems that are easier to govern and maintain.

His work connects institutional strategy with technical execution — helping teams improve accessibility, clarify content, strengthen digital governance, and prepare web systems for changing search, AI, and compliance expectations.

If you're exploring his work, projects, or digital leadership approach, feel free to ask. If you'd like to connect directly, there's a contact form at the bottom of this page.
`;

    const vagueQuestionInstruction = `
If the user asks a short or vague question, infer that they may be asking about Roger Ehmpke's work, projects, experience, KCC role, accessibility governance, CMS architecture, AI-ready content, or higher-ed web strategy. Answer helpfully using the provided context instead of saying "No response."
`;

    let chatHistory = [];

    if (sessionStorage.getItem("gptChatHistory")) {
        try {
            chatHistory = JSON.parse(sessionStorage.getItem("gptChatHistory")) || [];
        } catch (e) {
            chatHistory = [];
        }
    }

    const pageContext = document.querySelector("meta[name='ai-context']")?.content || "";

    const combinedContext = pageContext.length > 10
        ? `${pageContext}\n\n${introText}\n\n${vagueQuestionInstruction}`
        : `${introText}\n\n${vagueQuestionInstruction}`;

    document.getElementById("ai-widget-button").onclick = () => {
        const box = document.getElementById("ai-widget-box");
        box.style.display = box.style.display === "none" ? "block" : "none";
    };

    function submitPrompt() {
        const inputField = document.getElementById("ai-widget-input");
        const input = inputField.value.trim();

        if (!input) return;

        const log = document.getElementById("ai-widget-log");

        const cleanInput = window.DOMPurify
            ? DOMPurify.sanitize(input, { USE_PROFILES: { html: true } })
            : input.replace(/[<>&"]/g, "");

        chatHistory.push({ role: "user", content: cleanInput });
        sessionStorage.setItem("gptChatHistory", JSON.stringify(chatHistory));

        log.innerHTML += `<p><strong>You:</strong> ${cleanInput}</p>`;

        fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                question: cleanInput,
                contextBlock: combinedContext,
                messageHistory: chatHistory,
                siteInstruction: vagueQuestionInstruction
            })
        })
            .then(res => res.json())
            .then(data => {
                console.log("Assistant response:", data);

                const answerText = typeof data.answer === "string"
                    ? data.answer.trim()
                    : "";

                const rawAnswer =
                    answerText &&
                        answerText.toLowerCase() !== "no response." &&
                        answerText.toLowerCase() !== "no response"
                        ? answerText
                        : "I can help with Roger's KCC work, accessibility governance, CMS architecture, AI-ready content, web strategy, or selected projects. Try asking something like: What does Roger do at KCC?";

                const cleanAnswer = window.DOMPurify
                    ? DOMPurify.sanitize(rawAnswer, { USE_PROFILES: { html: true } })
                    : String(rawAnswer).replace(/[<>&"]/g, "");

                chatHistory.push({ role: "assistant", content: cleanAnswer });
                sessionStorage.setItem("gptChatHistory", JSON.stringify(chatHistory));

                log.innerHTML += `<p><strong>Assistant:</strong> ${cleanAnswer}<br><em>Need more info? <a href="/#contact">Contact Roger here.</a></em></p>`;

                inputField.value = "";
            })
            .catch(err => {
                console.error("Chat fetch error:", err);
                log.innerHTML += `<p><em>Error connecting to assistant.</em></p>`;
            });
    }
</script>
