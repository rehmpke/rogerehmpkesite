<!-- Loading JavaScript
================================================== -->
<script src="{{ '/assets/js/index.js' | relative_url }}" defer></script>

<!-- GPT Assistant Chat Widget -->
<button id="ai-widget-button" type="button" aria-expanded="false" aria-controls="ai-widget-box">
    <span aria-hidden="true">💬</span>
    <span>Ask about Roger's work</span>
</button>

<section id="ai-widget-box" role="region" aria-labelledby="ai-widget-title" hidden>
    <div class="ai-widget-header">
        <h2 id="ai-widget-title">Ask about Roger's work</h2>

        <button id="ai-widget-close" type="button" aria-label="Close chat assistant">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <p class="ai-widget-intro">
        Ask about Roger's higher-ed web strategy, accessibility work,
        digital systems, or selected projects.
    </p>

    <h3 id="ai-widget-conversation-title" class="ai-widget-sr-only">
        Conversation
    </h3>

    <div id="ai-widget-log" role="log" aria-live="polite" aria-relevant="additions text" aria-atomic="false"
        aria-labelledby="ai-widget-conversation-title"></div>

    <form id="ai-widget-form">
        <label for="ai-widget-input">Your question</label>

        <textarea id="ai-widget-input" name="question" rows="3"
            placeholder="Ask a question about my work or this site..." aria-describedby="ai-widget-help"
            required></textarea>

        <p id="ai-widget-help" class="ai-widget-help">
            Do not include sensitive personal information. Press Control or
            Command + Enter to submit.
        </p>

        <button id="ai-widget-submit" type="submit">
            Ask
        </button>
    </form>

    <p id="ai-widget-status" class="ai-widget-status" role="status" aria-live="polite"></p>
</section>

<style>
    [hidden] {
        display: none !important;
    }

    .ai-widget-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    #ai-widget-button {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 999;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.8rem;
        background: #0f1d2e;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
    }

    #ai-widget-button:hover {
        background: #18334f;
    }

    #ai-widget-button:focus-visible,
    #ai-widget-close:focus-visible,
    #ai-widget-submit:focus-visible,
    #ai-widget-input:focus-visible {
        outline: 3px solid #f4c95d;
        outline-offset: 3px;
    }

    #ai-widget-box {
        position: fixed;
        right: 1rem;
        bottom: 4.75rem;
        z-index: 1000;
        width: min(22rem, calc(100vw - 2rem));
        max-height: min(70vh, 36rem);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 1rem;
        border: 1px solid #b9c3cc;
        border-radius: 0.8rem;
        background: #ffffff;
        color: #071f35;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
    }

    .ai-widget-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.5rem;
    }

    .ai-widget-header h2 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.25;
    }

    #ai-widget-close {
        flex: 0 0 auto;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 1px solid #8c99a5;
        border-radius: 50%;
        background: #ffffff;
        color: #071f35;
        font: inherit;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
    }

    .ai-widget-intro {
        margin: 0 0 1rem;
        font-size: 0.9rem;
        line-height: 1.45;
    }

    #ai-widget-log {
        max-height: 14rem;
        overflow-y: auto;
        margin-bottom: 1rem;
        padding-right: 0.25rem;
        font-size: 0.9rem;
        line-height: 1.45;
    }

    .ai-widget-message {
        margin: 0 0 0.75rem;
        padding: 0.65rem;
        border-radius: 0.5rem;
        background: #f2f5f7;
    }

    .ai-widget-message p {
        margin: 0;
    }

    .ai-widget-message p+p {
        margin-top: 0.5rem;
    }

    .ai-widget-message-content {
        white-space: pre-wrap;
    }

    #ai-widget-form {
        display: grid;
        gap: 0.5rem;
    }

    #ai-widget-form label {
        font-weight: 700;
    }

    #ai-widget-input {
        width: 100%;
        min-height: 5rem;
        box-sizing: border-box;
        padding: 0.6rem;
        border: 1px solid #707b85;
        border-radius: 0.35rem;
        background: #ffffff;
        color: #000000;
        font: inherit;
        resize: vertical;
    }

    .ai-widget-help {
        margin: 0;
        font-size: 0.78rem;
        line-height: 1.4;
    }

    #ai-widget-submit {
        justify-self: start;
        padding: 0.6rem 1rem;
        border: 2px solid #071f35;
        border-radius: 0.4rem;
        background: #071f35;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    #ai-widget-submit:disabled {
        cursor: wait;
        opacity: 0.7;
    }

    .ai-widget-status {
        min-height: 1.4em;
        margin: 0.75rem 0 0;
        font-size: 0.85rem;
    }

    @media (max-width: 480px) {
        #ai-widget-button {
            right: 0.75rem;
            bottom: 0.75rem;
        }

        #ai-widget-box {
            right: 0.75rem;
            bottom: 4.5rem;
            width: calc(100vw - 1.5rem);
        }
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.5/purify.min.js" defer
    integrity="sha512-/CUtA84sWWqWEBejNrrtWa7Yc4cth3Ome2ymvCKOo9YcZ4sh98tndUy4LutE2xGcAgD4fyz16y+gSyJdGCB5ww=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
    (() => {
        const endpoint =
            "https://tei23dyloh.execute-api.us-east-1.amazonaws.com/prod/gptAssistantHandler";

        const storageKey = "gptChatHistory";
        const maxHistoryItems = 12;

        const introText = `
Hi there — I'm here to help you learn more about Roger Ehmpke's work.

Roger leads higher-ed web strategy and digital experience, with a focus on accessibility governance, CMS architecture, UX, analytics, AI-ready content, and public-facing digital systems that are easier to govern and maintain.

His work connects institutional strategy with technical execution — helping teams improve accessibility, clarify content, strengthen digital governance, and prepare web systems for changing search, AI, and compliance expectations.

Ask about his work, selected projects, or digital leadership approach. Use the Contact link to connect with Roger directly.
`;

        const vagueQuestionInstruction = `
If the user asks a short or vague question, infer that they may be asking about Roger Ehmpke's work, projects, experience, KCC role, accessibility governance, CMS architecture, AI-ready content, or higher-ed web strategy. Answer helpfully using the provided context instead of saying "No response."
`;

        const trigger = document.getElementById("ai-widget-button");
        const panel = document.getElementById("ai-widget-box");
        const closeButton = document.getElementById("ai-widget-close");
        const form = document.getElementById("ai-widget-form");
        const inputField = document.getElementById("ai-widget-input");
        const submitButton = document.getElementById("ai-widget-submit");
        const log = document.getElementById("ai-widget-log");
        const status = document.getElementById("ai-widget-status");

        const pageContext =
            document.querySelector("meta[name='ai-context']")?.content || "";

        const combinedContext =
            pageContext.length > 10
                ? `${pageContext}\n\n${introText}\n\n${vagueQuestionInstruction}`
                : `${introText}\n\n${vagueQuestionInstruction}`;

        let chatHistory = loadChatHistory();
        let requestInProgress = false;

        function loadChatHistory() {
            try {
                const storedHistory = JSON.parse(
                    sessionStorage.getItem(storageKey)
                );

                if (!Array.isArray(storedHistory)) {
                    return [];
                }

                return storedHistory.filter((message) => {
                    return (
                        message &&
                        ["user", "assistant"].includes(message.role) &&
                        typeof message.content === "string"
                    );
                });
            } catch (error) {
                return [];
            }
        }

        function saveChatHistory() {
            try {
                sessionStorage.setItem(
                    storageKey,
                    JSON.stringify(chatHistory)
                );
            } catch (error) {
                console.warn("Unable to save chat history.", error);
            }
        }

        function addToHistory(role, content) {
            chatHistory.push({ role, content });

            if (chatHistory.length > maxHistoryItems) {
                chatHistory = chatHistory.slice(-maxHistoryItems);
            }

            saveChatHistory();
        }

        function appendMessage(role, content, includeContactLink = false) {
            const message = document.createElement("div");
            message.className = `ai-widget-message ai-widget-message--${role}`;

            const paragraph = document.createElement("p");

            const speaker = document.createElement("strong");
            speaker.textContent = role === "user" ? "You: " : "Assistant: ";

            const messageContent = document.createElement("span");
            messageContent.className = "ai-widget-message-content";

            if (
                role === "assistant" &&
                window.DOMPurify
            ) {
                messageContent.innerHTML = window.DOMPurify.sanitize(content, {
                    USE_PROFILES: { html: true }
                });
            } else {
                messageContent.textContent = content;
            }

            paragraph.appendChild(speaker);
            paragraph.appendChild(messageContent);
            message.appendChild(paragraph);

            if (includeContactLink) {
                const followUp = document.createElement("p");
                const emphasis = document.createElement("em");

                emphasis.append("Need more information? ");

                const contactLink = document.createElement("a");
                contactLink.href = "/#contact";
                contactLink.textContent = "Contact Roger.";

                emphasis.appendChild(contactLink);
                followUp.appendChild(emphasis);
                message.appendChild(followUp);
            }

            log.appendChild(message);
            log.scrollTop = log.scrollHeight;
        }

        function renderStoredHistory() {
            chatHistory.forEach((message) => {
                appendMessage(
                    message.role,
                    message.content,
                    message.role === "assistant"
                );
            });
        }

        function openWidget() {
            panel.hidden = false;
            trigger.setAttribute("aria-expanded", "true");

            window.requestAnimationFrame(() => {
                inputField.focus();
            });
        }

        function closeWidget() {
            panel.hidden = true;
            trigger.setAttribute("aria-expanded", "false");
            trigger.focus();
        }

        trigger.addEventListener("click", () => {
            if (panel.hidden) {
                openWidget();
            } else {
                closeWidget();
            }
        });

        closeButton.addEventListener("click", closeWidget);

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !panel.hidden) {
                event.preventDefault();
                closeWidget();
            }
        });

        inputField.addEventListener("keydown", (event) => {
            if (
                event.key === "Enter" &&
                (event.ctrlKey || event.metaKey)
            ) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (requestInProgress) {
                return;
            }

            const input = inputField.value.trim();

            if (!input) {
                status.textContent = "Enter a question before submitting.";
                inputField.focus();
                return;
            }

            requestInProgress = true;
            submitButton.disabled = true;
            submitButton.textContent = "Asking…";
            panel.setAttribute("aria-busy", "true");
            status.textContent = "Getting a response.";

            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                event: "ai_chat_submit"
            });

            appendMessage("user", input);
            addToHistory("user", input);

            inputField.value = "";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: input,
                        contextBlock: combinedContext,
                        messageHistory: chatHistory,
                        siteInstruction: vagueQuestionInstruction
                    })
                });

                if (!response.ok) {
                    throw new Error(
                        `Assistant request failed with status ${response.status}.`
                    );
                }

                const data = await response.json();

                const answerText =
                    typeof data.answer === "string"
                        ? data.answer.trim()
                        : "";

                const rawAnswer =
                    answerText &&
                        answerText.toLowerCase() !== "no response." &&
                        answerText.toLowerCase() !== "no response"
                        ? answerText
                        : "I can help with Roger's KCC work, accessibility governance, CMS architecture, AI-ready content, web strategy, or selected projects. Try asking: What does Roger do at KCC?";

                appendMessage("assistant", rawAnswer, true);
                addToHistory("assistant", rawAnswer);

                status.textContent = "Response received.";
            } catch (error) {
                console.error("Chat fetch error:", error);

                const errorMessage =
                    "I could not connect to the assistant. Please try again or use the contact form.";

                appendMessage("assistant", errorMessage);
                status.textContent = "The assistant could not be reached.";
            } finally {
                requestInProgress = false;
                submitButton.disabled = false;
                submitButton.textContent = "Ask";
                panel.removeAttribute("aria-busy");
                inputField.focus();
            }
        });

        renderStoredHistory();
    })();
</script>
